<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>catch-the-flag</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>catch-the-flag</h1>
    <p>Welcome to the catch-the-flag dashboard! Here you can monitor the latest readings from the sensors of your machine.</p>
    <canvas id="cpuChart" width="400" height="200"></canvas>
    <canvas id="memoryChart" width="400" height="200"></canvas>
    <canvas id="batteryChart" width="400" height="200"></canvas>
    <canvas id="batteryGauge" width="400" height="200"></canvas>
    <p id="batteryStatus"></p>
    <p id="netup">Upload: -- kbps</p>
    <p id="netdown">Download: -- kbps</p>
    <h2>Top Processes</h2>
    <ul id="topProcesses"></ul>
    <canvas id="diskChart" width="400" height="200"></canvas>

    <script>
        const cpuChart = new Chart(document.getElementById('cpuChart').getContext('2d'), {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'CPU Usage (%)',
                    data: [],
                    borderColor: 'rgba(75, 192, 192, 1)',
                    borderWidth: 1,
                    fill: false
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100
                    }
                }
            }
        });

        const memoryChart = new Chart(document.getElementById('memoryChart').getContext('2d'), {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Memory Usage (%)',
                    data: [],
                    borderColor: 'rgba(153, 102, 255, 1)',
                    borderWidth: 1,
                    fill: false
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100
                    }
                }
            }
        });

        const batteryChart = new Chart(document.getElementById('batteryChart').getContext('2d'), {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Battery Level (%)',
                    data: [],
                    borderColor: 'rgba(255, 159, 64, 1)',
                    borderWidth: 1,
                    fill: false
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100
                    }
                }
            }
        });

        const diskChart = new Chart(document.getElementById('diskChart').getContext('2d'), {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Disk Usage (%)',
                    data: [],
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1,
                    fill: false
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100
                    }
                }
            }
        });

        async function refreshData() {
            const response = await fetch('http://127.0.0.1:8000/metrics/readings');
            const data = await response.json();
            const readings = data.readings;

            cpuChart.data.labels = readings.map((_, index) => index + 1);
            cpuChart.data.datasets[0].data = readings.map(reading => reading.cpu_percent);
            cpuChart.update();

            memoryChart.data.labels = readings.map((_, index) => index + 1);
            memoryChart.data.datasets[0].data = readings.map(reading => reading.memory_percent);
            memoryChart.update();

            batteryChart.data.labels = readings.map((_, index) => index + 1);
            batteryChart.data.datasets[0].data = readings.map(reading => reading.battery_percent);
            batteryChart.update();

            diskChart.data.labels = readings.map((_, index) => index + 1);
            diskChart.data.datasets[0].data = readings.map(reading => reading.disk_percent);
            diskChart.update();

            const latestReading = readings.find(reading => reading.net_up_kbps !== null && reading.net_down_kbps !== null);
            if (latestReading) {
                document.getElementById('netup').textContent = `Upload: ${latestReading.net_up_kbps.toFixed(2)} kbps`;
                document.getElementById('netdown').textContent = `Download: ${latestReading.net_down_kbps.toFixed(2)} kbps`;
            
            }

            const latestWithProcesses = readings.find(reading => reading.top_processes !== null && reading.top_processes.length > 0);
            if (latestWithProcesses) {
                const topProcessesList = document.getElementById('topProcesses');
                topProcessesList.innerHTML = '';
                const process = JSON.parse(latestWithProcesses.top_processes);
                process.forEach(proc => {
                    const listItem = document.createElement('li');
                    listItem.textContent = `PID: ${proc.pid}, Name: ${proc.name}, CPU: ${proc.cpu_percent}%, Memory: ${proc.memory_percent}%`;
                    topProcessesList.appendChild(listItem);
                });
            }
        }

    
        // Initial data load
        refreshData();

        // Refresh data every 3 seconds
        setInterval(refreshData, 3000);

        const batteryGauge = new Chart(document.getElementById('batteryGauge').getContext('2d'), {
            type: 'doughnut',
            data: {
                labels: ['Battery Level'],
                datasets: [{
                    data: [0],
                    backgroundColor: ['rgba(255, 159, 64, 1)', 'rgba(220, 220, 220, 1)'],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: false,
                plugins: {
                    legend: {
                        display: true,
                        position: 'top',
                    },
                    title: {
                        display: true,
                        text: 'Battery Level'
                    }
                }
            }
        });

      
        async function refreshBatteryGauge() {
            const response = await fetch('http://127.0.0.1:8000/metrics');
            const live = await response.json();
            
            const percentage = live.battery_percent;
            if (percentage === null || percentage.length === 0) {
                document.getElementById('batteryStatus').textContent = `Battery Level: N/A`;
                return;
            }
        
            batteryGauge.data.datasets[0].data = [percentage, 100 - percentage];
            batteryGauge.update();

            let level = 'Low';
            if (percentage >= 70) {
                level = 'High';
            } else if (percentage >= 50) {
                level = 'Medium';
            } else {
                level = 'Low';
            }

            let status = '';
            if (live.battery_plugged) {
                status = 'Plugged In';
            } else if (live.battery_seconds_left !== null && live.battery_seconds_left !== undefined && live.battery_seconds_left !== -1) {
                const hours = Math.floor(live.battery_seconds_left / 3600);
                const minutes = Math.floor((live.battery_seconds_left % 3600) / 60);
                status = `On Battery - ${hours}h ${minutes}m left`;
            } else {
                status = 'On Battery';
            }
          
            document.getElementById('batteryStatus').textContent = `Battery Level: ${percentage}% (${level}) - ${status}`;
        }

        refreshBatteryGauge();
        setInterval(refreshBatteryGauge, 3000);
    </script>
</body>
</html>
